<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SPOOKIES</title>
<style>
/* ============================================================
   SPOOKIES — палитра и базовые токены
   ============================================================ */
:root{
  --bg-1:#1a0b2e;
  --bg-2:#2d1b4e;
  --orange:#ff7518;
  --lime:#9acd32;
  --pink:#ff69b4;
  --wine:#8b1a2b;
  --ink:#0b0417;
  --cream:#fff7ea;

  --tile:40px;          /* пересчитывается из JS */
  --gap:3px;
  --frame:11px;       /* отступ рамки от поля со всех сторон */
  --header-h:104px;     /* пересчитывается из JS */
  --footer-h:56px;

  --cell-bg:rgba(255,255,255,0.07);
  --cell-br:rgba(255,255,255,0.12);
  --cell-bg-special:rgba(255,255,255,0.14);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;padding:0;height:100%;width:100%;
  background:var(--bg-1);
  overflow:hidden;
  overscroll-behavior:none;
  touch-action:manipulation;
  user-select:none;-webkit-user-select:none;
  -webkit-touch-callout:none;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color:var(--cream);
}

#app{
  position:relative;width:100%;height:100%;
  min-height:100%;
  background:linear-gradient(180deg,var(--bg-1) 0%,var(--bg-2) 100%);
  overflow:hidden;
}

/* ---------- «карамельная» типографика ---------- */
.candy{
  font-weight:900;
  letter-spacing:0.02em;
  -webkit-text-stroke:1.5px var(--ink);
  paint-order:stroke fill;
  text-shadow:0 2px 0 rgba(0,0,0,0.45);
}

/* ============================================================
   ФОН: ночное небо, луна, ветки, мыши, туман
   ============================================================ */
#sky{
  position:absolute;inset:0;z-index:0;pointer-events:none;
  background-color:var(--bg-1);
  /* картинка подставляется из CONFIG.assets.bg; градиент — запасной слой,
     он же виден, если bg.webp не загрузился */
  background-image:linear-gradient(180deg,var(--bg-1),var(--bg-2));
  background-size:cover;background-position:center;background-repeat:no-repeat;
}
#sky svg{width:100%;height:100%;display:block;}

/* ---------- летучие мыши ----------
   Три независимых слоя: горизонтальный пролёт, вертикальное покачивание
   и смена кадров силуэта. Периоды у слоёв разные, поэтому траектория
   не читается как зацикленная. */
.bat{animation:batFly 15s ease-in-out infinite;}
.bat-2{animation-duration:21s;animation-delay:-7s;}
.bat-3{animation-duration:27s;animation-delay:-15s;}
@keyframes batFly{from{transform:translateX(-60px)}to{transform:translateX(470px)}}

.bob{animation:batBob 3.6s ease-in-out infinite;}
.bat-2 .bob{animation-duration:2.9s;animation-delay:-1.1s;}
.bat-3 .bob{animation-duration:4.4s;animation-delay:-2.3s;}
@keyframes batBob{
  0%{transform:translateY(0)}
  25%{transform:translateY(-8px)}
  50%{transform:translateY(3px)}
  75%{transform:translateY(-11px)}
  100%{transform:translateY(0)}
}

/* кадры взмаха: вверх → в стороны → вниз → в стороны */
.fr{animation-duration:.44s;animation-iteration-count:infinite;animation-timing-function:steps(1,end);}
.bat-2 .fr{animation-duration:.36s;animation-delay:-.12s;}
.bat-3 .fr{animation-duration:.52s;animation-delay:-.25s;}
.fr-up{animation-name:frUp;}
.fr-mid{animation-name:frMid;}
.fr-down{animation-name:frDown;}
@keyframes frUp  {0%{opacity:1}25%{opacity:0}100%{opacity:0}}
@keyframes frMid {0%{opacity:0}25%{opacity:1}50%{opacity:0}75%{opacity:1}100%{opacity:1}}
@keyframes frDown{0%{opacity:0}50%{opacity:1}75%{opacity:0}100%{opacity:0}}

.fog{animation:fogDrift 26s ease-in-out infinite alternate;opacity:.45;}
@keyframes fogDrift{from{transform:translateX(-18px)}to{transform:translateX(18px)}}

/* ============================================================
   ГРАФ ДИНАКУЛА + облачко речи
   ============================================================ */
#dino-wrap{
  position:absolute;z-index:30;pointer-events:none;
  transition:top .35s ease,right .35s ease,left .35s ease,height .35s ease;
}
#dino-avatar{height:100%;width:auto;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));
  animation:sway 3.4s ease-in-out infinite;transform-origin:50% 100%;}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}

/* позиции Графа по экранам */
#dino-wrap.pos-start {top:21%;left:50%;height:180px;transform:translateX(-50%);}
#dino-wrap.pos-game  {top:2px;right:4px;height:calc(var(--header-h) - 4px);}
#dino-wrap.pos-result{top:38%;left:50%;height:132px;transform:translateX(-50%);}
#dino-wrap.hidden{display:none;}

#dino-name{
  position:absolute;top:100%;left:50%;transform:translateX(-50%);
  margin-top:2px;white-space:nowrap;font-size:13px;color:var(--pink);
}
#dino-wrap.pos-game #dino-name{display:none;}

#speech{
  position:absolute;right:calc(100% - 6px);top:14%;
  max-width:170px;min-width:96px;
  background:#fff;color:var(--ink);
  border:2.5px solid var(--ink);border-radius:14px;
  padding:8px 10px;font-size:12.5px;font-weight:700;line-height:1.25;
  box-shadow:0 4px 0 rgba(0,0,0,.35);
  opacity:0;transform:translateY(6px) scale(.94);
  transition:opacity .22s ease,transform .22s ease;
}
#speech.show{opacity:1;transform:translateY(0) scale(1);}
#speech::after{ /* бордовый хвостик — как подкладка плаща */
  content:"";position:absolute;right:-11px;top:50%;margin-top:-7px;
  width:0;height:0;border:7px solid transparent;border-left-color:var(--wine);
}
#speech::before{
  content:"";position:absolute;right:-15px;top:50%;margin-top:-8px;
  width:0;height:0;border:8px solid transparent;border-left-color:var(--ink);
}

/* ============================================================
   ЭКРАНЫ
   ============================================================ */
.screen{
  position:absolute;inset:0;z-index:20;
  display:none;flex-direction:column;align-items:center;
  padding:14px 12px;
}
.screen.active{display:flex;}

button{
  font-family:inherit;font-weight:900;color:var(--cream);
  border:2.5px solid var(--ink);border-radius:14px;
  background:linear-gradient(180deg,#ff9a45,var(--orange));
  box-shadow:0 4px 0 var(--wine);
  min-height:44px;padding:0 18px;font-size:16px;
  cursor:pointer;transition:transform .08s ease,box-shadow .08s ease;
  touch-action:manipulation;
}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--wine);}
button[disabled]{opacity:.5;box-shadow:0 4px 0 rgba(0,0,0,.4);}
button.ghost{background:linear-gradient(180deg,#4a3070,#33204f);box-shadow:0 4px 0 #1c0f33;}

/* ---------- стартовый экран ---------- */
#logo{width:100%;max-width:320px;height:auto;display:block;margin-top:4px;}
#start-spacer{height:210px;flex:0 1 auto;min-height:130px;}
#bigo-field{width:100%;max-width:300px;display:flex;flex-direction:column;gap:6px;align-items:center;}
#bigo-input{
  width:100%;height:48px;text-align:center;
  font-family:inherit;font-size:17px;font-weight:800;letter-spacing:.04em;
  color:var(--cream);background:rgba(0,0,0,.35);
  border:2.5px solid var(--ink);border-radius:14px;outline:none;
}
#bigo-input:focus{border-color:var(--orange);}
#bigo-input::placeholder{color:rgba(255,247,234,.45);font-weight:600;letter-spacing:0;}
#bigo-error{min-height:16px;font-size:12px;font-weight:700;color:var(--pink);text-align:center;}
#btn-play{width:100%;max-width:300px;height:54px;font-size:19px;margin-top:2px;}
#btn-top-toggle{margin-top:10px;height:44px;font-size:14px;}
#top-panel{
  width:100%;max-width:300px;margin-top:8px;display:none;
  background:rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.14);
  border-radius:14px;padding:8px 10px;
}
#top-panel.open{display:block;}
.top-row{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;padding:3px 0;}
.top-rank{width:20px;color:var(--orange);}
.top-id{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.top-score{color:var(--lime);}
.top-empty{font-size:12px;opacity:.7;text-align:center;padding:6px 0;font-weight:600;}
/* строка игрока: своя позиция под таблицей топ-5 */
.top-row.is-me{background:rgba(255,117,24,.20);border-radius:8px;padding:4px 6px;margin:1px -2px;}
.top-tag{font-size:11px;font-weight:800;color:var(--orange);margin-left:2px;white-space:nowrap;}
.top-me{margin-top:7px;padding-top:7px;border-top:1px solid rgba(255,255,255,.16);}
.me-line{
  background:rgba(255,255,255,.12);border-radius:10px;
  padding:6px 8px;font-size:13px;font-weight:700;
}
.me-line.me-dim{font-weight:600;opacity:.72;}
.me-you{color:var(--orange);}

/* ---------- игровой экран ---------- */
#screen-game{padding:0;justify-content:flex-start;}
#hud{
  width:100%;height:var(--header-h);flex:0 0 auto;
  display:flex;align-items:center;
  padding:6px 10px;position:relative;z-index:25;
}
.hud-left{display:flex;flex-direction:column;gap:2px;}
.hud-row{display:flex;align-items:baseline;gap:7px;}
.hud-label{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;opacity:.65;}
.hud-val{font-size:26px;line-height:1;}
#score-val{color:var(--orange);}
#moves-val{color:var(--lime);}
#moves-val.low{color:var(--pink);animation:lowPulse .7s ease-in-out infinite;}
@keyframes lowPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.18)}}
#combo-line{
  font-size:14px;font-weight:900;color:var(--pink);
  opacity:0;transform:translateX(-6px);transition:opacity .2s,transform .2s;
  -webkit-text-stroke:1px var(--ink);paint-order:stroke fill;
}
#combo-line.show{opacity:1;transform:translateX(0);}

#board-area{flex:1 1 auto;width:100%;display:flex;align-items:center;justify-content:center;min-height:0;}
/* #board — ровно поле 8×8 и ничего больше: ни рамки, ни паддинга.
   Рамка живёт отдельным элементом снаружи, поэтому съехать не может. */
#board{position:relative;}
#frame{
  position:absolute;inset:calc(var(--frame) * -1);
  border:3px solid var(--ink);
  border-radius:16px;
  background:rgba(0,0,0,.22);
  box-shadow:inset 0 0 0 2px var(--wine), 0 8px 18px rgba(0,0,0,.4);
  pointer-events:none;
}
#cells{position:absolute;inset:0;}
.cell{
  position:absolute;width:var(--tile);height:var(--tile);
  background:var(--cell-bg);
  border-radius:10px;
  box-shadow:inset 0 0 0 1.5px var(--cell-br);
}
#tiles{position:absolute;inset:0;}
#fx{position:absolute;inset:0;pointer-events:none;overflow:visible;}

.tile{
  position:absolute;width:var(--tile);height:var(--tile);
  transition:transform .26s cubic-bezier(.32,.72,.34,1);
  will-change:transform;
}
.tile-inner{
  position:relative;
  width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;
  border-radius:10px;
  transition:transform .12s ease;
  will-change:transform;
}
.tile img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;}
.tile .fb{ /* видно только когда PNG не загрузился */
  display:none;position:absolute;inset:12%;border-radius:50%;
  align-items:center;justify-content:center;
  font-weight:900;font-size:calc(var(--tile) * .42);color:#1a0b2e;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.25);
}
.tile.picked .tile-inner{transform:scale(1.1);}
.tile.picked{z-index:6;}
.tile.picked .tile-inner{box-shadow:0 0 0 2px rgba(255,255,255,.55),0 0 14px rgba(255,117,24,.7);}

/* спецэлементы: крупнее, светлее ячейка, пульсация, свечение */
.tile.special .tile-inner{
  transform:scale(1.1);
  background:var(--cell-bg-special);
  animation:spPulse 1.5s ease-in-out infinite;
}
@keyframes spPulse{0%,100%{transform:scale(1.1)}50%{transform:scale(1.166)}}
.tile.sp-candle .tile-inner{box-shadow:0 0 12px 2px rgba(255,117,24,.75);}
.tile.sp-bomb   .tile-inner{box-shadow:0 0 16px 4px rgba(255,60,20,.85);}
.tile.sp-cauldron .tile-inner{box-shadow:0 0 14px 3px rgba(154,205,50,.8);}
/* фолбэк, если файла спецэлемента нет */
.tile.sp-missing .tile-inner{box-shadow:0 0 16px 4px rgba(255,255,255,.85);}

.tile.flash .tile-inner{animation:spFlash .45s ease-out;}
@keyframes spFlash{
  0%{transform:scale(1.5);filter:brightness(3);}
  60%{transform:scale(1.05);filter:brightness(1.4);}
  100%{transform:scale(1.1);filter:none;}
}
.tile.flash-strong .tile-inner{animation:spFlashStrong .6s ease-out;}
@keyframes spFlashStrong{
  0%{transform:scale(1.9);filter:brightness(5);}
  50%{transform:scale(1.15);filter:brightness(2);}
  100%{transform:scale(1.1);filter:none;}
}

.tile.pop .tile-inner{animation:pop .22s ease-in forwards;}
@keyframes pop{
  0%{transform:scale(1)}
  40%{transform:scale(1.25);filter:brightness(1.7)}
  100%{transform:scale(0);opacity:0}
}
.tile.reject{animation:reject .26s ease;}
@keyframes reject{0%,100%{filter:none}50%{filter:brightness(.65) saturate(.5)}}

.float-score{
  position:absolute;font-size:15px;font-weight:900;color:var(--cream);
  -webkit-text-stroke:1.5px var(--ink);paint-order:stroke fill;
  pointer-events:none;animation:floatUp .85s ease-out forwards;
}
@keyframes floatUp{
  0%{opacity:0;transform:translate(-50%,0) scale(.7)}
  25%{opacity:1;transform:translate(-50%,-10px) scale(1.1)}
  100%{opacity:0;transform:translate(-50%,-42px) scale(1)}
}
.burst{
  position:absolute;border-radius:50%;pointer-events:none;
  animation:burst .45s ease-out forwards;
}
@keyframes burst{
  0%{opacity:.9;transform:translate(-50%,-50%) scale(.2)}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.6)}
}

#controls{
  width:100%;height:var(--footer-h);flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;gap:10px;
  padding:0 12px 6px;
}
#btn-finish{flex:1;max-width:240px;height:46px;font-size:16px;}
#btn-sound{width:46px;height:46px;padding:0;font-size:18px;flex:0 0 auto;}

/* ---------- экран итога ---------- */
#screen-result{justify-content:flex-start;}
#result-title{font-size:20px;margin-top:22px;text-align:center;}
#result-score{font-size:52px;color:var(--orange);margin:6px 0 2px;}
#result-best{font-size:14px;font-weight:700;color:var(--lime);}
#result-rank{font-size:13px;font-weight:700;opacity:.85;margin-top:2px;}
#result-note{font-size:12px;font-weight:700;color:var(--pink);min-height:16px;margin-top:6px;text-align:center;max-width:280px;}
#result-actions{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:10px;padding:0 16px;}
#result-actions button{width:100%;max-width:300px;height:50px;}
#btn-top-result{height:44px;font-size:14px;}
</style>
</head>
<body>
<div id="app">

  <!-- ФОН -->
  <div id="sky">
    <svg viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="fogG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#7a5aa8" stop-opacity="0"/>
          <stop offset="100%" stop-color="#7a5aa8" stop-opacity=".35"/>
        </linearGradient>

        <!-- крыло рисуется один раз, правое — то же самое зеркально -->
        <path id="w-up"   d="M-3,-2.0 C-7.5,-6.5 -12,-10.5 -17,-11.5 C-15.5,-8.5 -13.5,-5 -11.6,-2.6 C-10.4,-3.6 -9.2,-3.2 -8.4,-1.8 C-7.4,-0.4 -5.8,0.2 -3,1.6 Z"/>
        <path id="w-mid"  d="M-3,-2.2 C-8,-4.2 -13,-4.6 -18.5,-2.2 C-16,-0.6 -14,1.4 -12.6,3.2 C-11.6,1.4 -10.4,1 -9.2,2.4 C-8.2,3.6 -7,3.6 -6,2.2 C-5,0.9 -4,0.9 -3,1.8 Z"/>
        <path id="w-down" d="M-3,-1.8 C-7.5,-0.6 -12,2.2 -15.5,7 C-13,6.6 -10.2,4.8 -8,2.8 C-7.2,3.6 -6,3.4 -5.2,2.2 C-4.6,1.4 -3.8,1 -3,1.6 Z"/>
        <g id="b-body">
          <ellipse cx="0" cy="0" rx="3" ry="4"/>
          <path d="M-2.4,-3.4 L-3.2,-6.8 L-0.6,-4.6 Z M2.4,-3.4 L3.2,-6.8 L0.6,-4.6 Z"/>
        </g>
        <!-- три кадра силуэта; тело в одной и той же точке, поэтому при
             переключении мышь не дёргается -->
        <g id="bat-up"><use href="#b-body"/><use href="#w-up"/><use href="#w-up" transform="scale(-1,1)"/></g>
        <g id="bat-mid"><use href="#b-body"/><use href="#w-mid"/><use href="#w-mid" transform="scale(-1,1)"/></g>
        <g id="bat-down"><use href="#b-body"/><use href="#w-down"/><use href="#w-down" transform="scale(-1,1)"/></g>
      </defs>

      <path class="fog" d="M-40 520 C 80 486, 150 546, 250 508 C 330 478, 380 526, 440 500 L440 620 L-40 620 Z" fill="url(#fogG)"/>

      <g transform="translate(0,150) scale(0.62)" fill="#0d0417">
        <g class="bat"><g class="bob">
          <g class="fr fr-up"><use href="#bat-up"/></g>
          <g class="fr fr-mid"><use href="#bat-mid"/></g>
          <g class="fr fr-down"><use href="#bat-down"/></g>
        </g></g>
      </g>
      <g transform="translate(0,238) scale(0.45)" fill="#0d0417" opacity=".8">
        <g class="bat bat-2"><g class="bob">
          <g class="fr fr-up"><use href="#bat-up"/></g>
          <g class="fr fr-mid"><use href="#bat-mid"/></g>
          <g class="fr fr-down"><use href="#bat-down"/></g>
        </g></g>
      </g>
      <g transform="translate(0,96) scale(0.78)" fill="#0d0417" opacity=".6">
        <g class="bat bat-3"><g class="bob">
          <g class="fr fr-up"><use href="#bat-up"/></g>
          <g class="fr fr-mid"><use href="#bat-mid"/></g>
          <g class="fr fr-down"><use href="#bat-down"/></g>
        </g></g>
      </g>
    </svg>
  </div>

  <!-- ГРАФ ДИНАКУЛА -->
  <div id="dino-wrap" class="pos-start">
    <img id="dino-avatar" src="dino.png" alt="Граф Динакула">
    <div id="dino-name" class="candy">Граф Динакула</div>
    <div id="speech"></div>
  </div>

  <!-- ЭКРАН 1: СТАРТ -->
  <section id="screen-start" class="screen active">
    <img id="logo" src="assets/logo.png" alt="SPOOKIES">
    <div id="start-spacer"></div>
    <div id="bigo-field">
      <input id="bigo-input" type="text" inputmode="text" autocomplete="off"
             autocapitalize="off" autocorrect="off" spellcheck="false" maxlength="40" placeholder="Твой BIGO ID">
      <div id="bigo-error"></div>
      <button id="btn-play" class="candy">Играть</button>
      <button id="btn-top-toggle" class="ghost">Топ-5</button>
      <div id="top-panel"></div>
    </div>
  </section>

  <!-- ЭКРАН 2: ИГРА -->
  <section id="screen-game" class="screen">
    <header id="hud">
      <div class="hud-left">
        <div class="hud-row"><span class="hud-label">Очки</span><span id="score-val" class="hud-val candy">0</span></div>
        <div class="hud-row"><span class="hud-label">Ходы</span><span id="moves-val" class="hud-val candy">30</span></div>
        <div id="combo-line"></div>
      </div>
    </header>
    <div id="board-area">
      <div id="board">
        <div id="frame"></div>
        <div id="cells"></div>
        <div id="tiles"></div>
        <div id="fx"></div>
      </div>
    </div>
    <footer id="controls">
      <button id="btn-finish" class="candy">Закончить</button>
      <button id="btn-sound" class="ghost" aria-label="Звук">🔇</button>
    </footer>
  </section>

  <!-- ЭКРАН 3: ИТОГ -->
  <section id="screen-result" class="screen">
    <div id="result-title" class="candy"></div>
    <div id="result-score" class="candy">0</div>
    <div id="result-best"></div>
    <div id="result-rank"></div>
    <div id="result-note"></div>
    <div id="result-actions">

/* ============================================================
   Storage — адаптер над localStorage с тихим фолбэком в память
   ============================================================ */
const Storage = (() => {
  let usable = true;
  const mem = {};
  try {
    const probe = '__spookies_probe__';
    localStorage.setItem(probe, '1');
    localStorage.removeItem(probe);
  } catch (e) { usable = false; }

  return {
    save(key, value) {
      const raw = JSON.stringify(value);
      if (usable) {
        try { localStorage.setItem(key, raw); return true; }
        catch (e) { usable = false; }
      }
      mem[key] = raw;
      return true;
    },
    load(key, fallback) {
      let raw = null;
      if (usable) {
        try { raw = localStorage.getItem(key); }
        catch (e) { usable = false; }
      }
      if (raw === null || raw === undefined) raw = (key in mem) ? mem[key] : null;
      if (raw === null) return fallback;
      try { return JSON.parse(raw); } catch (e) { return fallback; }
    }
  };
})();

/* ============================================================
   Leaderboard — единственная точка связи с сервером
   ============================================================ */
const Leaderboard = (() => {
  const KEY = 'spookies.scores';
  const PENDING = 'spookies.pending';   // результаты, не дошедшие до сервера
  const sent = new Set();               // sessionId, уже отправленные в этой сессии

  function all() { return Storage.load(KEY, []); }

  // локальное зеркало: одна запись на игрока, сравнение по нижнему регистру
  function mergeLocal(entry) {
    const list = all();
    const i = list.findIndex(e => e.key === entry.key);
    if (i >= 0) {
      if (entry.score > list[i].score) list[i] = Object.assign({}, entry);
    } else {
      list.push(Object.assign({}, entry));
    }
    list.sort((a, b) => b.score - a.score);
    Storage.save(KEY, list);
    return list;
  }

  function pendingAll() { return Storage.load(PENDING, []); }
  function pendingAdd(body) {
    const list = pendingAll();
    if (list.some(x => x.sessionId === body.sessionId)) return;
    list.push(body);
    Storage.save(PENDING, list.slice(-20)); // храним последние 20, больше не нужно
  }
  function pendingDrop(sessionId) {
    Storage.save(PENDING, pendingAll().filter(x => x.sessionId !== sessionId));
  }

  // Apps Script не умеет OPTIONS, поэтому запрос должен быть «простым»:
  // text/plain, никаких своих заголовков, ключ — в теле.
  async function post(body) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), CONFIG.API_TIMEOUT);
    try {
      const res = await fetch(CONFIG.API_BASE, {
        method: 'POST',
        redirect: 'follow',                                  // Apps Script отвечает редиректом
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(body),
        signal: ctrl.signal
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return await res.json();
    } finally { clearTimeout(timer); }
  }

  return {
    // { ok, rank, best, offline, error }
    async submit(payload) {
      const bigoId = payload.bigoId;
      const key = bigoId.toLowerCase();
      const list = mergeLocal({ bigoId, key, score: payload.score, playedAt: payload.playedAt });
      const mine = list.filter(e => e.key === key).map(e => e.score);
      const best = mine.length ? Math.max.apply(null, mine) : payload.score;
      const localRank = list.findIndex(e => e.key === key) + 1;

      const body = {
        action: 'submit',
        gameKey: CONFIG.GAME_KEY,
        bigoId: bigoId,
        score: payload.score,
        moves: payload.moves,
        duration: payload.duration,
        sessionId: payload.sessionId,
        clientTs: payload.playedAt
      };

      if (!CONFIG.API_BASE) return { ok: true, rank: localRank, best, total: list.length, offline: false };
      if (sent.has(payload.sessionId)) return { ok: true, rank: localRank, best, total: list.length, offline: false };

      try {
        const data = await post(body);
        sent.add(payload.sessionId);
        pendingDrop(payload.sessionId);
        if (data && data.ok === false) {
          // сервер отказал осмысленно — его текст написан для игрока
          return { ok: false, error: data.error || '', rank: localRank, best, offline: false };
        }
        return {
          ok: true,
          rank: (data && data.rank != null) ? data.rank : localRank,
          best: (data && data.best != null) ? data.best : best,
          total: (data && data.total != null) ? data.total : undefined,
          offline: false
        };
      } catch (e) {
        console.warn('[SPOOKIES] результат не ушёл на сервер, дошлём позже:', e);
        pendingAdd(body);
        return { ok: false, rank: localRank, best, offline: true };
      }
    },

    // [{ bigoId, score, rank }]
    async top(limit) {
      limit = limit || 5;
      const local = all().slice(0, limit).map((e, i) => ({ bigoId: e.bigoId, score: e.score, rank: i + 1 }));
      if (!CONFIG.API_BASE) return local;

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), CONFIG.API_TIMEOUT);
      try {
        const res = await fetch(CONFIG.API_BASE + '?action=top&limit=' + limit, {
          method: 'GET', redirect: 'follow', signal: ctrl.signal
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        return Array.isArray(data) ? data : local;
      } catch (e) {
        console.warn('[SPOOKIES] топ не загрузился, показываю локальный:', e);
        return local;
      } finally { clearTimeout(timer); }
    },

    // позиция владельца введённого BIGO ID: { found, bigoId, score, rank, total }
    async me(bigoId) {
      const id = String(bigoId || '');
      const key = id.toLowerCase();
      if (!key) return { found: false };

      const list = all();
      const i = list.findIndex(e => e.key === key);
      const local = (i >= 0)
        ? { found: true, bigoId: list[i].bigoId, score: list[i].score, rank: i + 1, total: list.length }
        : { found: false, total: list.length };

      if (!CONFIG.API_BASE) return local;

      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), CONFIG.API_TIMEOUT);
      try {
        const res = await fetch(CONFIG.API_BASE + '?action=rank&bigoId=' + encodeURIComponent(id), {
          method: 'GET', redirect: 'follow', signal: ctrl.signal
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        // сервер может ещё не уметь action=rank — это не поломка, а «место появится позже»
        if (!data || typeof data.found !== 'boolean') throw new Error('действие не поддерживается');
        return data;
      } catch (e) {
        console.warn('[SPOOKIES] позиция игрока не загрузилась:', e);
        return { error: true };
      } finally { clearTimeout(timer); }
    },

    // тихая досылка накопленного при следующем открытии игры, по одному
    async flushPending() {
      if (!CONFIG.API_BASE) return;
      const list = pendingAll();
      for (const body of list) {
        try {
          const data = await post(body);
          sent.add(body.sessionId);
          pendingDrop(body.sessionId);
          if (data && data.ok === false) console.warn('[SPOOKIES] сервер отклонил отложенный результат:', data.error);
        } catch (e) {
          console.warn('[SPOOKIES] досылка не удалась, попробуем в следующий раз');
          break; // сеть недоступна — остальные ждут следующего запуска
        }
      }
    }
  };
})();

/* ============================================================
   Assets — предзагрузка и проверка наличия картинок
   ============================================================ */
const Assets = (() => {
  const missing = new Set();
  function preload(src) {
    return new Promise(resolve => {
      const img = new Image();
      img.onload = () => resolve(true);
      img.onerror = () => { missing.add(src); resolve(false); };
      img.src = src;
    });
  }
  return {
    markMissing(src) { if (src) { missing.add(src); Assets.report(); } },
    list() { return Array.from(missing); },
    async init() {
      const list = CONFIG.tiles.map(t => t.src)
        .concat(Object.keys(CONFIG.specials).map(k => CONFIG.specials[k].src))
        .concat([CONFIG.assets.dino, CONFIG.assets.logo, CONFIG.assets.bg]);
      await Promise.all(list.map(preload));
      this.report();
    },
    has(src) { return !missing.has(src); },
    // плашка со списком битых путей прямо на экране — чтобы не лезть в консоль
    report() {
      if (!missing.size) return;
      console.warn('[SPOOKIES] не загрузились файлы (проверь путь и регистр имён):', Array.from(missing));
      let bar = document.getElementById('asset-error');
      if (!bar) {
        bar = document.createElement('div');
        bar.id = 'asset-error';
        bar.style.cssText = 'position:absolute;left:0;right:0;top:0;z-index:99;max-height:42%;overflow:auto;' +
          'background:#8b1a2b;color:#fff;font:700 11px/1.4 monospace;padding:6px 8px;text-align:left;';
        bar.addEventListener('click', () => bar.remove());
        const app = document.getElementById('app');
        if (app) app.appendChild(bar);
      }
      bar.textContent = 'Не загрузились файлы (тап чтобы скрыть): ' + Array.from(missing).join('  |  ');
    }
  };
})();

/* ============================================================
   Sound — минимальный WebAudio, по умолчанию выключен
   ============================================================ */
const Sound = (() => {
  let ctx = null, on = CONFIG.sound.enabledByDefault;
  function ensure() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    return ctx;
  }
  function beep(freq, dur, type, vol) {
    if (!on) return;
    const c = ensure(); if (!c) return;
    try {
      const o = c.createOscillator(), g = c.createGain();
      o.type = type || 'triangle'; o.frequency.value = freq;
      g.gain.value = vol || 0.08;
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      o.connect(g); g.connect(c.destination);
      o.start(); o.stop(c.currentTime + dur);
    } catch (e) {}
  }
  return {
    toggle() { on = !on; if (on) ensure(); return on; },
    isOn() { return on; },
    pop(step) { beep(420 + (step || 0) * 60, 0.12, 'triangle', 0.07); },
    special() { beep(760, 0.22, 'square', 0.06); },
    swap() { beep(300, 0.07, 'sine', 0.05); },
    reject() { beep(150, 0.12, 'sawtooth', 0.05); },
    shuffle() { beep(220, 0.3, 'sine', 0.06); }
  };
})();

/* ============================================================
   Утилиты
   ============================================================ */
const N = CONFIG.grid.size;
const wait = ms => new Promise(r => setTimeout(r, ms));
const rnd = arr => arr[Math.floor(Math.random() * arr.length)];
const K = (r, c) => r + ',' + c;
const unK = k => k.split(',').map(Number);
function uuid() {
  if (window.crypto && crypto.randomUUID) { try { return crypto.randomUUID(); } catch (e) {} }
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, ch => {
    const r = Math.random() * 16 | 0;
    return (ch === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
  });
}
// 8320 → «8 320», разделитель неразрывный
function formatNum(n) {
  return String(Number(n) || 0).replace(/\B(?=(\d{3})+(?!\d))/g, '\u00A0');
}
function srcOfType(type) {
  const t = CONFIG.tiles.find(x => x.type === type);
  return t ? t.src : '';
}

/* ============================================================
   Dino — реплики без повтора подряд, одно облачко за раз
   ============================================================ */
const Dino = (() => {
  const last = {};
  let hideTimer = null, idleTimer = null;

  function pick(cat) {
    const lines = CONFIG.dinoLines[cat] || [];
    if (!lines.length) return '';
    let line, guard = 0;
    do { line = rnd(lines); guard++; } while (lines.length > 1 && line === last[cat] && guard < 12);
    last[cat] = line;
    return line;
  }

  return {
    say(cat, vars) {
      let text = pick(cat);
      if (!text) return;
      text = text.replace('{hero}', CONFIG.heroName).replace('{score}', (vars && vars.score) || 0);
      el.speech.textContent = text;
      el.speech.classList.add('show');
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => el.speech.classList.remove('show'), CONFIG.timings.speech);
    },
    hide() { clearTimeout(hideTimer); el.speech.classList.remove('show'); },
    resetIdle() {
      clearTimeout(idleTimer);
      idleTimer = setTimeout(() => {
        if (Game.isPlaying() && !Game.isBusy()) { Dino.say('idle'); Dino.resetIdle(); }
      }, CONFIG.timings.idle);
    },
    stopIdle() { clearTimeout(idleTimer); },
    move(pos) { el.dinoWrap.className = pos; }
  };
})();

/* ============================================================
   Board — модель поля и вся математика match-3
   ============================================================ */
let grid = [];         // grid[r][c] = { id, type, special, el } | null
let nextId = 1;
let lastSwapKeys = null;

function makeTile(type, special) {
  return { id: nextId++, type: type, special: special || null, el: null };
}
function randomType() { return rnd(CONFIG.tiles).type; }

function buildBoard() {
  grid = [];
  for (let r = 0; r < N; r++) {
    grid[r] = [];
    for (let c = 0; c < N; c++) {
      let type, guard = 0;
      do { type = randomType(); guard++; } while (guard < 30 && createsMatchAt(r, c, type));
      grid[r][c] = makeTile(type, null);
    }
  }
  if (!hasValidMove()) buildBoard();
}
// проверка «не образует ли этот тип готовое совпадение при генерации»
function createsMatchAt(r, c, type) {
  const same = (rr, cc) => rr >= 0 && cc >= 0 && rr < N && cc < N && grid[rr] && grid[rr][cc] && grid[rr][cc].type === type;
  if (same(r, c - 1) && same(r, c - 2)) return true;
  if (same(r - 1, c) && same(r - 2, c)) return true;
  return false;
}

// все прогоны длиной ≥3
function findRuns() {
  const runs = [];
  for (let r = 0; r < N; r++) {
    let c = 0;
    while (c < N) {
      const t = grid[r][c];
      if (!t) { c++; continue; }
      let e = c;
      while (e + 1 < N && grid[r][e + 1] && grid[r][e + 1].type === t.type) e++;
      const len = e - c + 1;
      if (len >= 3) {
        const cells = []; for (let i = c; i <= e; i++) cells.push(K(r, i));
        runs.push({ dir: 'h', len, type: t.type, cells });
      }
      c = e + 1;
    }
  }
  for (let c = 0; c < N; c++) {
    let r = 0;
    while (r < N) {
      const t = grid[r][c];
      if (!t) { r++; continue; }
      let e = r;
      while (e + 1 < N && grid[e + 1][c] && grid[e + 1][c].type === t.type) e++;
      const len = e - r + 1;
      if (len >= 3) {
        const cells = []; for (let i = r; i <= e; i++) cells.push(K(i, c));
        runs.push({ dir: 'v', len, type: t.type, cells });
      }
      r = e + 1;
    }
  }
  return runs;
}

// прогоны, пересекающиеся по клетке, объединяем в группу (нужно для L/T)
function findGroups() {
  const runs = findRuns();
  const used = new Array(runs.length).fill(false);
  const groups = [];
  for (let i = 0; i < runs.length; i++) {
    if (used[i]) continue;
    used[i] = true;
    const g = { type: runs[i].type, runs: [runs[i]], cells: new Set(runs[i].cells) };
    let changed = true;
    while (changed) {
      changed = false;
      for (let j = 0; j < runs.length; j++) {
        if (used[j] || runs[j].type !== g.type) continue;
        if (runs[j].cells.some(k => g.cells.has(k))) {
          used[j] = true; g.runs.push(runs[j]);
          runs[j].cells.forEach(k => g.cells.add(k));
          changed = true;
        }
      }
    }
    groups.push(g);
  }
  return groups;
}

// какой спецэлемент рождает эта группа
function decideSpecial(g) {
  const hasH = g.runs.some(r => r.dir === 'h');
  const hasV = g.runs.some(r => r.dir === 'v');
  const longest = g.runs.reduce((a, b) => (b.len > a.len ? b : a));
  if (hasH && hasV) return 'bomb';          // L или T
  if (longest.len >= 5) return 'cauldron';  // 5 в ряд
  if (longest.len === 4) return longest.dir === 'h' ? 'candle-h' : 'candle-v';
  return null;
}
// где родится спецэлемент: под пальцем игрока, иначе — в середине прогона
function specialCell(g) {
  if (lastSwapKeys) for (const k of lastSwapKeys) if (g.cells.has(k)) return k;
  const longest = g.runs.reduce((a, b) => (b.len > a.len ? b : a));
  return longest.cells[Math.floor(longest.cells.length / 2)];
}

function baseScore(n) {
  if (n <= 3) return CONFIG.scoring.base[3];
  if (n === 4) return CONFIG.scoring.base[4];
  return CONFIG.scoring.base[5] + (n - 5) * CONFIG.scoring.extraPerTile;
}

function mostCommonType() {
  const count = {};
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c];
    if (t && !t.special) count[t.type] = (count[t.type] || 0) + 1;
  }
  let best = null, max = -1;
  for (const k in count) if (count[k] > max) { max = count[k]; best = k; }
  return best || randomType();
}

// раскрытие цепочки: спецэлементы в наборе срабатывают и добавляют свои клетки
function expand(seed) {
  const removal = new Set();
  const activated = [];
  const queue = Array.from(seed);
  while (queue.length) {
    const key = queue.pop();
    if (removal.has(key)) continue;
    const [r, c] = unK(key);
    if (r < 0 || c < 0 || r >= N || c >= N) continue;
    const t = grid[r][c];
    if (!t) continue;
    removal.add(key);
    if (t.special) {
      activated.push({ r, c, special: t.special, type: t.type });
      areaOf(t.special, r, c, t.type).forEach(k => { if (!removal.has(k)) queue.push(k); });
    }
  }
  return { removal, activated };
}

function areaOf(special, r, c, type) {
  const out = [];
  if (special === 'candle-h') { for (let i = 0; i < N; i++) out.push(K(r, i)); }
  else if (special === 'candle-v') { for (let i = 0; i < N; i++) out.push(K(i, c)); }
  else if (special === 'bomb') {
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const rr = r + dr, cc = c + dc;
      if (rr >= 0 && cc >= 0 && rr < N && cc < N) out.push(K(rr, cc));
    }
  } else if (special === 'cauldron') {
    // котёл сам по себе (в каскаде) утягивает самый частый тип
    const target = mostCommonType();
    for (let rr = 0; rr < N; rr++) for (let cc = 0; cc < N; cc++) {
      const t = grid[rr][cc];
      if (t && !t.special && t.type === target) out.push(K(rr, cc));
    }
  }
  return out;
}

function hasValidMove() {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const t = grid[r][c];
    if (t && t.special) return true; // спецэлемент всегда можно активировать свайпом
  }
  const dirs = [[0, 1], [1, 0]];
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    for (const d of dirs) {
      const r2 = r + d[0], c2 = c + d[1];
      if (r2 >= N || c2 >= N) continue;
      swapModel(r, c, r2, c2);
      const ok = findRuns().length > 0;
      swapModel(r, c, r2, c2);
      if (ok) return true;
    }
  }
  return false;
}
function swapModel(r1, c1, r2, c2) {
  const t = grid[r1][c1]; grid[r1][c1] = grid[r2][c2]; grid[r2][c2] = t;
}

/* ============================================================
   Render — размеры, отрисовка, анимации
   ============================================================ */
let TILE = 40;

function layoutSize() {
  const h = el.app.clientHeight || 600;
  const headerH = Math.max(76, Math.min(112, Math.round(h * 0.18)));
  document.documentElement.style.setProperty('--header-h', headerH + 'px');

  const areaW = el.boardArea.clientWidth || el.app.clientWidth;
  const areaH = el.boardArea.clientHeight || 300;
  const gap = CONFIG.grid.gap, pad = CONFIG.grid.padX;

  const FRAME = 22; // 11px рамки с каждой стороны
  const byW = Math.floor((areaW - 2 * pad - FRAME - (N - 1) * gap) / N);
  const byH = Math.floor((areaH - FRAME - (N - 1) * gap - 8) / N);
  TILE = Math.max(CONFIG.grid.minTile, Math.min(CONFIG.grid.maxTile, Math.min(byW, byH)));

  document.documentElement.style.setProperty('--tile', TILE + 'px');
  document.documentElement.style.setProperty('--gap', gap + 'px');
  const side = N * TILE + (N - 1) * gap; // #board — ровно поле, без рамки
  el.board.style.width = side + 'px';
  el.board.style.height = side + 'px';
  drawCells();
  layoutTiles(false);
}

function pos(i) { return i * (TILE + CONFIG.grid.gap); }

function drawCells() {
  el.cells.innerHTML = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    const d = document.createElement('div');
    d.className = 'cell';
    d.style.transform = 'translate3d(' + pos(c) + 'px,' + pos(r) + 'px,0)';
    el.cells.appendChild(d);
  }
}

function createTileEl(tile, r, c) {
  const d = document.createElement('div');
  d.className = 'tile';
  d.style.transform = 'translate3d(' + pos(c) + 'px,' + pos(r) + 'px,0)';
  const inner = document.createElement('div');
  inner.className = 'tile-inner';
  const img = document.createElement('img');
  img.alt = '';
  // страховка на случай, если картинка не загрузилась уже после предзагрузки
  img.addEventListener('error', () => { Assets.markMissing(img.getAttribute('src')); showFallback(tile); });
  const fb = document.createElement('span');
  fb.className = 'fb';
  inner.appendChild(img);
  inner.appendChild(fb);
  d.appendChild(inner);
  tile.el = d;
  el.tilesLayer.appendChild(d);
  paintTile(tile);
  return d;
}

function paintTile(tile) {
  const img = tile.el.querySelector('img');
  const fb = tile.el.querySelector('.fb');
  tile.el.classList.remove('special', 'sp-candle', 'sp-bomb', 'sp-cauldron', 'sp-missing');

  let src = srcOfType(tile.type);
  if (tile.special) {
    const cfg = CONFIG.specials[tile.special];
    tile.el.classList.add('special');
    if (cfg && Assets.has(cfg.src)) {
      src = cfg.src;
      tile.el.classList.add(cfg.cls);
    } else {
      // файла спецэлемента нет — обычный тайл со свечением
      tile.el.classList.add('sp-missing');
    }
  }

  if (Assets.has(src)) {
    img.style.display = '';
    fb.style.display = 'none';
    img.src = src;
  } else {
    showFallback(tile);
  }
}

// читаемая заглушка вместо пустой ячейки — сразу видно, какой тайл не нашёлся
function showFallback(tile) {
  if (!tile.el) return;
  const cfg = CONFIG.tiles.find(t => t.type === tile.type) || {};
  const img = tile.el.querySelector('img');
  const fb = tile.el.querySelector('.fb');
  img.style.display = 'none';
  fb.style.display = 'flex';
  fb.style.background = cfg.fbColor || '#888';
  fb.textContent = cfg.fbLetter || '?';
}

function layoutTiles(animate) {
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (!grid[r]) continue;            // поле ещё не построено — просто нечего раскладывать
    const t = grid[r][c];
    if (!t) continue;
    if (!t.el) createTileEl(t, r, c);
    if (!animate) t.el.style.transition = 'none';
    t.el.style.transform = 'translate3d(' + pos(c) + 'px,' + pos(r) + 'px,0)';
    if (!animate) { void t.el.offsetHeight; t.el.style.transition = ''; }
  }
}

function renderAll() {
  el.tilesLayer.innerHTML = '';
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
    if (!grid[r]) continue;
    const t = grid[r][c];
    if (t) { t.el = null; createTileEl(t, r, c); }
  }
}

function floatText(r, c, text) {
  const d = document.createElement('div');
  d.className = 'float-score';
  d.textContent = text;
  d.style.left = (pos(c) + TILE / 2) + 'px';
  d.style.top = (pos(r) + TILE / 4) + 'px';
  el.fx.appendChild(d);
  setTimeout(() => d.remove(), 900);
}
function burst(r, c, color) {
  const d = document.createElement('div');
  d.className = 'burst';
  d.style.left = (pos(c) + TILE / 2) + 'px';
  d.style.top = (pos(r) + TILE / 2) + 'px';
  d.style.width = TILE + 'px'; d.style.height = TILE + 'px';
  d.style.background = 'radial-gradient(circle,' + color + ' 0%, transparent 70%)';
  el.fx.appendChild(d);
  setTimeout(() => d.remove(), 470);
}

/* ============================================================
   Game — ходы, каскады, очки, экраны
   ============================================================ */
const Game = (() => {
  let score = 0, shownScore = 0, moves = 0, busy = false, playing = false;
  let bonusUsed = 0, movesMade = 0, startedAt = 0, sessionId = null;
  let bigoId = '', scoreAnim = null;

  /* ---------- счёт с набегающими цифрами ---------- */
  function addScore(points) {
    score += points;
    if (scoreAnim) cancelAnimationFrame(scoreAnim);
    const from = shownScore, to = score, t0 = performance.now(), dur = 420;
    const step = now => {
      const k = Math.min(1, (now - t0) / dur);
      shownScore = Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)));
      el.scoreVal.textContent = shownScore;
      if (k < 1) scoreAnim = requestAnimationFrame(step);
    };
    scoreAnim = requestAnimationFrame(step);
  }

  function setMoves(v) {
    moves = Math.max(0, v);
    el.movesVal.textContent = moves;
    el.movesVal.classList.toggle('low', moves <= CONFIG.moves.lowThreshold);
  }

  function showCombo(mult) {
    if (mult < 2) { el.comboLine.classList.remove('show'); return; }
    el.comboLine.textContent = CONFIG.texts.comboLabel + mult;
    el.comboLine.classList.add('show');
    clearTimeout(showCombo._t);
    showCombo._t = setTimeout(() => el.comboLine.classList.remove('show'), 1400);
  }

  function grantBonus(n) {
    if (n <= 0) return 0;
    const left = CONFIG.moves.maxBonusPerSession - bonusUsed;
    const give = Math.max(0, Math.min(n, CONFIG.moves.maxBonusPerMove, left));
    if (give > 0) { bonusUsed += give; setMoves(moves + give); }
    return give;
  }

  /* ---------- удаление и гравитация ---------- */
  async function popCells(keys, mult) {
    const els = [];
    keys.forEach(k => {
      const [r, c] = unK(k);
      const t = grid[r][c];
      if (!t) return;
      t.el.classList.add('pop');
      els.push(t.el);
      grid[r][c] = null;
    });
    Sound.pop(mult);
    await wait(CONFIG.timings.pop);
    els.forEach(e => e.remove());
  }

  async function gravityAndRefill() {
    const fresh = [];
    for (let c = 0; c < N; c++) {
      let write = N - 1;
      for (let r = N - 1; r >= 0; r--) {
        if (grid[r][c]) {
          if (write !== r) { grid[write][c] = grid[r][c]; grid[r][c] = null; }
          write--;
        }
      }
      let spawn = -1;
      for (let r = write; r >= 0; r--) {
        const t = makeTile(randomType(), null);
        grid[r][c] = t;
        createTileEl(t, spawn, c);
        fresh.push(t);
        spawn--;
      }
    }
    if (fresh.length) void el.tilesLayer.offsetHeight; // форсируем reflow, чтобы падение анимировалось
    layoutTiles(true);
    await wait(CONFIG.timings.fall);
  }

  /* ---------- главный цикл хода ---------- */
  async function runTurn(forcedRemoval) {
    let wave = 0, maxWave = 0, specialsCreated = 0;
    let pending = forcedRemoval || null;

    while (true) {
      let seeds, plans = [], waveScore = 0, matchedCount = 0;

      if (pending) { seeds = pending; pending = null; }
      else {
        const groups = findGroups();
        if (!groups.length) break;
        seeds = new Set();
        for (const g of groups) {
          const sp = decideSpecial(g);
          if (sp) {
            const key = specialCell(g);
            plans.push({ key, special: sp, type: g.type });
          }
          waveScore += baseScore(g.cells.size);
          matchedCount += g.cells.size;
          g.cells.forEach(k => seeds.add(k));
        }
      }

      wave++; maxWave = wave;
      const mult = Math.min(wave, CONFIG.scoring.maxMultiplier);

      const { removal, activated } = expand(seeds);
      waveScore += activated.length * CONFIG.scoring.specialBonus;
      // тайлы, снесённые взрывом, тоже приносят очки
      waveScore += Math.max(0, removal.size - matchedCount) * CONFIG.scoring.perBlastTile;

      // клетки, где родится спецэлемент, не лопаются
      const planKeys = new Set(plans.map(p => p.key));
      const toPop = new Set();
      removal.forEach(k => { if (!planKeys.has(k)) toPop.add(k); });

      // визуал: всплывающие очки и вспышки от спецэлементов
      const gained = waveScore * mult;
      if (gained > 0) {
        const first = toPop.values().next().value || plans[0] && plans[0].key;
        if (first) { const [fr, fc] = unK(first); floatText(fr, fc, '+' + gained); }
        addScore(gained);
      }
      activated.forEach(a => {
        const color = a.special === 'cauldron' ? 'rgba(154,205,50,.9)'
                    : a.special === 'bomb' ? 'rgba(255,60,20,.95)' : 'rgba(255,117,24,.9)';
        burst(a.r, a.c, color);
      });
      if (activated.length) Sound.special();
      if (mult >= 2) showCombo(mult);
      if (mult >= 3) Dino.say('combo');

      await popCells(toPop, wave);

      // рождение спецэлементов
      for (const p of plans) {
        const [r, c] = unK(p.key);
        let t = grid[r][c];
        if (!t) { t = makeTile(p.type, null); grid[r][c] = t; createTileEl(t, r, c); }
        t.type = p.type; t.special = p.special;
        paintTile(t);
        t.el.classList.remove('flash', 'flash-strong');
        void t.el.offsetHeight;
        // бомбу показываем ярче: её силуэт совпадает с обычной тыквой
        t.el.classList.add(p.special === 'bomb' ? 'flash-strong' : 'flash');
        specialsCreated++;
      }
      if (plans.length) { Dino.say('special'); Sound.special(); }

      await gravityAndRefill();
    }

    // бонусные ходы: за глубокий каскад и за созданные спецэлементы
    let bonus = 0;
    if (maxWave >= CONFIG.moves.cascadeBonusFrom) bonus += CONFIG.moves.bonusPerCascade;
    bonus += specialsCreated * CONFIG.moves.bonusPerSpecialCreated;
    grantBonus(bonus);
  }

  /* ---------- комбинации двух спецэлементов ---------- */
  function comboRemoval(r1, c1, r2, c2) {
    const a = grid[r1][c1], b = grid[r2][c2];
    const set = new Set([K(r1, c1), K(r2, c2)]);
    const isCandle = s => s === 'candle-h' || s === 'candle-v';

    // котёл + котёл — чистое поле
    if (a.special === 'cauldron' && b.special === 'cauldron') {
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) set.add(K(r, c));
      return set;
    }
    // котёл + спецэлемент — все тайлы самого частого типа становятся этим спецом
    if (a.special === 'cauldron' || b.special === 'cauldron') {
      const other = a.special === 'cauldron' ? b : a;
      if (other.special) {
        const target = mostCommonType();
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          const t = grid[r][c];
          if (t && !t.special && t.type === target) { t.special = other.special; paintTile(t); set.add(K(r, c)); }
        }
      } else {
        // котёл + обычный тайл — утягивает весь его тип
        for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
          const t = grid[r][c];
          if (t && !t.special && t.type === other.type) set.add(K(r, c));
        }
      }
      return set;
    }
    // свеча + бомба — три строки и три столбца
    if ((isCandle(a.special) && b.special === 'bomb') || (a.special === 'bomb' && isCandle(b.special))) {
      for (let d = -1; d <= 1; d++) for (let i = 0; i < N; i++) {
        if (r1 + d >= 0 && r1 + d < N) set.add(K(r1 + d, i));
        if (c1 + d >= 0 && c1 + d < N) set.add(K(i, c1 + d));
      }
      return set;
    }
    // бомба + бомба — область 5×5
    if (a.special === 'bomb' && b.special === 'bomb') {
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) {
        const rr = r1 + dr, cc = c1 + dc;
        if (rr >= 0 && cc >= 0 && rr < N && cc < N) set.add(K(rr, cc));
      }
      return set;
    }
    // свеча + свеча — крест (получается сам из раскрытия цепочки)
    return set;
  }

  /* ---------- обмен по свайпу ---------- */
  async function trySwap(r1, c1, r2, c2) {
    if (busy || !playing || moves <= 0) return;
    if (r2 < 0 || c2 < 0 || r2 >= N || c2 >= N) return;
    const a = grid[r1][c1], b = grid[r2][c2];
    if (!a || !b) return;

    busy = true;
    Dino.resetIdle();
    lastSwapKeys = [K(r1, c1), K(r2, c2)];

    swapModel(r1, c1, r2, c2);
    layoutTiles(true);
    Sound.swap();
    await wait(CONFIG.timings.swap);

    const specialInvolved = !!(a.special || b.special);

    if (specialInvolved) {
      // свайп со спецэлементом срабатывает всегда — это не «неудачный ход»
      setMoves(moves - 1); movesMade++;
      const removal = comboRemoval(r1, c1, r2, c2);
      await runTurn(removal);
    } else {
      if (!findRuns().length) {
        // отказ: возвращаем на место
        swapModel(r1, c1, r2, c2);
        layoutTiles(true);
        [grid[r1][c1], grid[r2][c2]].forEach(t => {
          if (!t) return;
          t.el.classList.add('reject');
          setTimeout(() => t.el.classList.remove('reject'), CONFIG.timings.reject);
        });
        Sound.reject();
        await wait(CONFIG.timings.reject);
        lastSwapKeys = null;
        busy = false;
        return;
      }
      setMoves(moves - 1); movesMade++;
      await runTurn(null);
    }

    lastSwapKeys = null;

    // тупика не бывает: перемешиваем
    if (!hasValidMove()) await shuffleBoard();

    if (moves === CONFIG.moves.lowThreshold) Dino.say('lowMoves');
    busy = false;

    if (moves <= 0) { await wait(400); finish(); }
  }

  async function shuffleBoard() {
    Dino.say('shuffle'); Sound.shuffle();
    el.tilesLayer.style.transition = 'transform .25s ease, opacity .25s ease';
    el.tilesLayer.style.transform = 'scale(.86) rotate(-3deg)';
    el.tilesLayer.style.opacity = '.4';
    await wait(260);

    const types = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) types.push(grid[r][c].type);
    let guard = 0;
    do {
      for (let i = types.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const t = types[i]; types[i] = types[j]; types[j] = t;
      }
      let i = 0;
      for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) grid[r][c].type = types[i++];
      guard++;
    } while (guard < 25 && (findRuns().length > 0 || !hasValidMove()));

    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (grid[r][c]) paintTile(grid[r][c]);
    el.tilesLayer.style.transform = 'scale(1) rotate(0)';
    el.tilesLayer.style.opacity = '1';
    await wait(280);
    el.tilesLayer.style.transition = '';
  }

  /* ---------- ввод: тап и свайп ---------- */
  function bindInput() {
    let startX = 0, startY = 0, startR = -1, startC = -1, active = false, fired = false;

    function cellFromEvent(e) {
      const rect = el.tilesLayer.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      const step = TILE + CONFIG.grid.gap;
      const c = Math.floor(x / step), r = Math.floor(y / step);
      if (r < 0 || c < 0 || r >= N || c >= N) return null;
      return { r, c };
    }

    el.board.addEventListener('pointerdown', e => {
      if (busy || !playing) return;
      const cell = cellFromEvent(e);
      if (!cell) return;
      active = true; fired = false;
      startX = e.clientX; startY = e.clientY; startR = cell.r; startC = cell.c;
      const t = grid[startR][startC];
      if (t) t.el.classList.add('picked');
      Dino.resetIdle();
    });

    function release() {
      active = false;
      const t = startR >= 0 && grid[startR] && grid[startR][startC];
      if (t && t.el) t.el.classList.remove('picked');
      startR = startC = -1;
    }

    el.board.addEventListener('pointermove', e => {
      if (!active || fired) return;
      const dx = e.clientX - startX, dy = e.clientY - startY;
      if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
      fired = true;
      // направление — по большей оси; диагональ трактуем как ближайшую сторону
      let dr = 0, dc = 0;
      if (Math.abs(dx) >= Math.abs(dy)) dc = dx > 0 ? 1 : -1;
      else dr = dy > 0 ? 1 : -1;
      const r1 = startR, c1 = startC;
      release();
      trySwap(r1, c1, r1 + dr, c1 + dc);
    });

    el.board.addEventListener('pointerup', release);
    el.board.addEventListener('pointercancel', release);
    el.board.addEventListener('pointerleave', release);
    // блокируем скролл страницы жестом по полю
    el.board.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
  }

  /* ---------- сессия ---------- */
  function start(id) {
    bigoId = id;
    score = 0; shownScore = 0; bonusUsed = 0; movesMade = 0;
    sessionId = uuid(); startedAt = Date.now();
    el.scoreVal.textContent = '0';
    setMoves(CONFIG.moves.start);
    el.comboLine.classList.remove('show');
    playing = true; busy = false;

    UI.show('game');
    Dino.move('pos-game');
    try {
      layoutSize();
      buildBoard();
      renderAll();
      layoutTiles(false);
    } catch (e) {
      console.error('[SPOOKIES] сбой при построении поля:', e);
      buildBoard(); renderAll(); layoutTiles(false);
    }
    Dino.say('greeting');
    Dino.resetIdle();
  }

  function finish() {
    playing = false;
    Dino.stopIdle();
    const duration = Math.round((Date.now() - startedAt) / 1000);
    UI.showResult({
      bigoId, score, sessionId,
      moves: movesMade,
      duration,
      playedAt: new Date().toISOString()
    });
  }

  return {
    start, finish, bindInput,
    isBusy: () => busy,
    isPlaying: () => playing,
    getScore: () => score
  };
})();

/* ============================================================
   UI — экраны, валидация ID, топ-5
   ============================================================ */
const UI = (() => {
  const ID_KEY = 'spookies.bigoId';
  let lastResult = null, saving = false, saved = false;
  let meCache = null;   // позиция игрока, чтобы не дёргать сервер при каждом открытии панели

  // нормализация: срезаем «ID:», убираем пробелы
  function normalizeId(raw) {
    let v = String(raw || '');
    v = v.replace(/^\s*id\s*[:：]?\s*/i, '');
    v = v.replace(/[\s\u00a0]/g, '');
    return v;
  }
  function validateId(raw) {
    const v = normalizeId(raw);
    if (!v) return { ok: false, error: CONFIG.texts.errEmpty, value: '' };
    if (/[\u0400-\u04FF]/.test(v)) return { ok: false, error: CONFIG.texts.errCyrillic, value: v };
    if (!CONFIG.bigoId.pattern.test(v)) return { ok: false, error: CONFIG.texts.errChars, value: v };
    if (v.length < CONFIG.bigoId.min) return { ok: false, error: CONFIG.texts.errShort, value: v };
    if (v.length > CONFIG.bigoId.max) return { ok: false, error: CONFIG.texts.errLong, value: v };
    return { ok: true, error: '', value: v };
  }

  function show(name) {
    for (const k in el.screens) el.screens[k].classList.toggle('active', k === name);
  }

  // одна строка «Ты: N-е место из M · X очков» во всех её состояниях
  function renderMeLine(node, me) {
    if (!node) return;
    if (!me || me.error) { node.className = 'me-line me-dim'; node.textContent = CONFIG.texts.meError; return; }
    if (!me.found) { node.className = 'me-line me-dim'; node.textContent = CONFIG.texts.meNone; return; }
    const place = me.total
      ? CONFIG.texts.mePlace.replace('{rank}', me.rank).replace('{total}', formatNum(me.total))
      : CONFIG.texts.mePlaceNoTotal.replace('{rank}', me.rank);
    node.className = 'me-line';
    node.innerHTML = '<span class="me-you"></span> ' + place + ' \u00B7 ' +
                     formatNum(me.score) + ' ' + CONFIG.texts.meScoreWord;
    node.querySelector('.me-you').textContent = CONFIG.texts.meYou;
  }

  async function renderTop(container) {
    container.innerHTML = '<div class="top-empty">' + CONFIG.texts.meLoading + '</div>';

    const myId = Storage.load(ID_KEY, '');
    const myKey = myId ? myId.toLowerCase() : '';
    const list = await Leaderboard.top(5);

    let html = '';
    if (!list.length) {
      html += '<div class="top-empty">' + CONFIG.texts.topEmpty + '</div>';
    } else {
      html += list.map(e => {
        const isMe = myKey && String(e.bigoId).toLowerCase() === myKey;
        return '<div class="top-row' + (isMe ? ' is-me' : '') + '">' +
               '<span class="top-rank">' + e.rank + '</span>' +
               '<span class="top-id"></span>' +
               (isMe ? '<span class="top-tag">' + CONFIG.texts.meTag + '</span>' : '') +
               '<span class="top-score">' + formatNum(e.score) + '</span></div>';
      }).join('');
    }
    html += '<div class="top-me"><div class="me-line me-dim">' + CONFIG.texts.meLoading + '</div></div>';
    container.innerHTML = html;

    // ID вставляем текстом, чтобы не ловить разметку из чужого ввода
    const nodes = container.querySelectorAll('.top-id');
    list.forEach((e, i) => { if (nodes[i]) nodes[i].textContent = e.bigoId; });

    const meBox = container.querySelector('.top-me');
    // игрок уже подсвечен внутри таблицы — отдельной строкой не дублируем
    const inTop = myKey && list.some(e => String(e.bigoId).toLowerCase() === myKey);
    if (!myId || inTop) { if (meBox) meBox.remove(); return; }

    const me = meCache || await Leaderboard.me(myId);
    if (me && !me.error) meCache = me;           // один запрос на открытие экрана
    renderMeLine(meBox.firstChild, me);
  }

  function showResult(data) {
    lastResult = data; saved = false; saving = false;
    meCache = null;   // сыграна новая партия — позиция могла измениться
    show('result');
    Dino.move('pos-result');
    el.resultTitle.textContent = CONFIG.texts.resultTitle;
    el.resultScore.textContent = data.score;
    const stored = Storage.load('spookies.best.' + data.bigoId.toLowerCase(), 0);
    const best = Math.max(stored, data.score);
    Storage.save('spookies.best.' + data.bigoId.toLowerCase(), best);
    el.resultBest.textContent = CONFIG.texts.bestLabel + ' ' + formatNum(best);
    el.resultRank.textContent = '';
    el.resultNote.textContent = '';
    el.btnSave.disabled = false;
    el.btnSave.textContent = CONFIG.texts.saveBtn;
    Dino.say('farewell', { score: data.score });
  }

  async function saveResult() {
    if (!lastResult || saving || saved) return;
    saving = true;
    el.btnSave.disabled = true;
    el.btnSave.textContent = CONFIG.texts.savingBtn;
    const res = await Leaderboard.submit(lastResult);
    saving = false; saved = true;
    el.btnSave.textContent = CONFIG.texts.savedBtn;
    if (res.error) {
      // сервер отказал осмысленно — показываем его текст, он написан для игрока
      el.resultNote.textContent = res.error;
    } else {
      el.resultNote.textContent = res.offline ? CONFIG.texts.savedOffline : CONFIG.texts.savedOk;
    }
    // позицию берём из ответа на сохранение — отдельный запрос здесь не нужен
    if (res.rank) {
      el.resultRank.className = '';
      el.resultRank.innerHTML = '<span class="me-line"></span>';
      renderMeLine(el.resultRank.firstChild, {
        found: true, rank: res.rank, total: res.total, score: res.best != null ? res.best : lastResult.score
      });
      meCache = { found: true, rank: res.rank, total: res.total, score: res.best };
    }
    if (res.best) el.resultBest.textContent = CONFIG.texts.bestLabel + ' ' + formatNum(res.best);
  }

  function bind() {
    // подставляем сохранённый ID
    const savedId = Storage.load(ID_KEY, '');
    if (savedId) el.input.value = savedId;
    el.btnPlay.disabled = !validateId(el.input.value).ok;

    el.input.addEventListener('input', () => {
      const v = validateId(el.input.value);
      el.inputError.textContent = el.input.value ? v.error : '';
      el.btnPlay.disabled = !v.ok;
    });
    el.input.addEventListener('blur', () => {
      const v = validateId(el.input.value);
      if (v.value) el.input.value = v.value; // показываем нормализованный вид
    });

    el.btnPlay.addEventListener('click', () => {
      const v = validateId(el.input.value);
      if (!v.ok) { el.inputError.textContent = v.error; return; }
      el.input.value = v.value;
      Storage.save(ID_KEY, v.value);
      el.input.blur();
      Game.start(v.value);
    });

    el.btnTopToggle.addEventListener('click', () => {
      const open = el.topPanel.classList.toggle('open');
      if (open) renderTop(el.topPanel);
    });

    el.btnFinish.addEventListener('click', () => { if (Game.isPlaying()) Game.finish(); });

    el.btnSound.addEventListener('click', () => {
      const on = Sound.toggle();
      el.btnSound.textContent = on ? '🔊' : '🔇';
    });

    el.btnSave.addEventListener('click', saveResult);

    el.btnAgain.addEventListener('click', () => {
      const id = Storage.load(ID_KEY, '');
      Game.start(id || lastResult.bigoId);
    });

    el.btnTopResult.addEventListener('click', () => {
      let panel = document.getElementById('top-panel-result');
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'top-panel-result';
        panel.className = 'open';
        panel.style.cssText = 'width:100%;max-width:300px;background:rgba(0,0,0,.32);border:2px solid rgba(255,255,255,.14);border-radius:14px;padding:8px 10px;';
        el.resultNote.after(panel);
      }
      renderTop(panel);
    });

    // глобальные запреты жестов
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());
  }

  return { show, showResult, bind, renderTop };
})();

/* ============================================================
   Старт
   ============================================================ */
(async function init() {
  el.dino.src = CONFIG.assets.dino;
  el.logo.src = CONFIG.assets.logo;
  // фон: картинка сверху, градиент снизу как запасной слой
  document.getElementById('sky').style.backgroundImage =
    "url('" + CONFIG.assets.bg + "'), linear-gradient(180deg, #1a0b2e, #2d1b4e)";
  el.dinoName.textContent = CONFIG.heroName;
  el.input.placeholder = CONFIG.texts.idPlaceholder;
  el.btnPlay.textContent = CONFIG.texts.playBtn;
  el.btnTopToggle.textContent = CONFIG.texts.topBtn;
  el.btnFinish.textContent = CONFIG.texts.finishBtn;
  el.btnSave.textContent = CONFIG.texts.saveBtn;
  el.btnAgain.textContent = CONFIG.texts.againBtn;
  el.btnTopResult.textContent = CONFIG.texts.topBtn;
  el.btnSound.textContent = Sound.isOn() ? '🔊' : '🔇';

  await Assets.init();
  Leaderboard.flushPending();   // без await: досылка не должна задерживать показ игры

  Dino.move('pos-start');
  Dino.say('greeting');
  UI.bind();
  Game.bindInput();
  layoutSize();

  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layoutSize, 120);
  });
  window.addEventListener('orientationchange', () => setTimeout(layoutSize, 250));
})();
</script>
